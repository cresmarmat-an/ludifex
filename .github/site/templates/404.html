<!DOCTYPE html>
<html lang="en" data-theme="auto" data-root="{{root}}" data-search="{{search_url}}">
<head>
{{> head}}
  <meta name="robots" content="noindex" />
</head>
<body id="top">
  <a class="skip-link" href="#main">Skip to content</a>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

{{> header}}

  <main id="main" class="container">
    <section class="lost">
      <h1><span class="accent">404</span></h1>
      <p>This page isn't part of the {{name}} documentation. It may have moved; search will find where it went.</p>
      <div class="lost-row">
        <button class="btn btn-primary" type="button" data-search-open>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
          Search
        </button>
        <a class="btn btn-soft" href="{{root}}">Documentation home</a>
      </div>
    </section>
  </main>

{{> footer}}
{{> search}}

  <script src="{{assets}}js/particles.js" defer></script>
  <script src="{{assets}}js/docs.js?v={{asset_version}}" defer></script>
</body>
</html>
