  <meta charset="UTF-8" />

  <script>
    // apply the saved theme before first paint so there's no flash
    document.documentElement.classList.add("js");
    try { document.documentElement.dataset.theme = localStorage.getItem("cm-theme") || "auto"; } catch (e) {}
  </script>
